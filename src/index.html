<link rel="stylesheet" href="css/style.css">
<script>
  (function () {
    var t = null;
    try { t = JSON.parse(localStorage.getItem("umoregi.theme") || "null"); } catch (e) {}
    var m = /[?&]theme=(light|dark)/.exec(location.search);
    if (m) t = m[1];
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
    /* 見比べ用：?seed=数字 をつけると、でたらめの順番が毎回同じになる */
    var s = /[?&]seed=(\d+)/.exec(location.search);
    if (s) {
      var x = Number(s[1]) >>> 0;
      Math.random = function () {
        x += 0x6d2b79f5;
        var r = Math.imul(x ^ (x >>> 15), 1 | x);
        r ^= r + Math.imul(r ^ (r >>> 7), 61 | r);
        return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
      };
    }
  })();
</script>
</head>
