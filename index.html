        if (st.mode === "jp") return chooseFrom(await stationsOf("cc:JP", "/json/stations/search?countrycode=JP&hidebroken=true&order=clickcount&reverse=false&limit=500"));
        if (st.mode === "any") {
          const list = (await rb("/json/stations/search?order=random&hidebroken=true&limit=200&_=" + Date.now())).filter(playable);
          return chooseFrom(list);
        }
        let near = nearList(st.lon);
        if (!near.length) near = countries.slice().sort((a, b) => lonDiff(a.lon, st.lon) - lonDiff(b.lon, st.lon)).slice(0, 3);
        /* 経線の上の国を順に見て、選んだ深さの局がある国を先に使う */
        let fallback = null;
        for (const c of U.shuffle(near).slice(0, 4)) {
          const list = await stationsOf("cc:" + c.code, "/json/stations/search?countrycode=" + c.code + "&hidebroken=true&order=clickcount&reverse=false&limit=500");
          if (!list.length) continue;
          const r = chooseFrom(list);
          if (r.list.length && !r.relaxed) return r;
          if (!fallback || (!fallback.list.length && (r.list.length || r.bandEmpty))) fallback = r;
        }
        return fallback || { list: [], relaxed: null };
      }
      function tryPlay(s, stale) {
        return new Promise((resolve) => {
          let done = false;
          const finish = (ok) => { if (done) return; done = true; clearTimeout(timer); stream.removeEventListener("playing", onPlay); stream.removeEventListener("error", onErr); resolve(ok); };
          const onPlay = () => finish(true);
          const onErr = () => finish(false);
          const timer = setTimeout(() => finish(false), 11000);
          stream.addEventListener("playing", onPlay);
          stream.addEventListener("error", onErr);
          /* 画面の下の「再生中」の帯に出す名前。帯の「止める」は電源を切るのと同じにする */
          if (U.nowPlaying) U.nowPlaying.tag(stream, {
            room: "radio",
            title: (s.name || "").trim() || "名前のない局",
            sub: [s.countrycode ? U.region(s.countrycode) : s.country, s.state].filter(Boolean).join("／"),
            art: s.favicon && /^https:/i.test(s.favicon) ? s.favicon : "",
            stop: () => togglePower(false)
          });
          stream.src = s.url_resolved;
          stream.play().catch(() => finish(false));
          const check = setInterval(() => { if (stale()) { clearInterval(check); finish(false); } if (done) clearInterval(check); }, 300);
        });
      }
      function fadeIn() {
        const target = Number(vol.value) / 100;
        stream.volume = 0;
        let v = 0;
        const step = () => { v = Math.min(target, v + target / 20); stream.volume = v; if (v < target) setTimeout(step, 60); };
        step();
        stat.level(0, 0.5);
      }

      function stationFind(s, relaxed) {
        const tags = String(s.tags || "").split(",").map((t) => t.trim()).filter(Boolean);
        const country = s.countrycode ? U.region(s.countrycode) : s.country;
        const mark = U.h("div", { class: "station-mark" });
        const initial = U.h("span", { class: "station-initial", "aria-hidden": "true" }, (s.name || "?").trim().charAt(0).toUpperCase());
        if (s.favicon && /^https?:/i.test(s.favicon) && (location.protocol !== "https:" || /^https:/i.test(s.favicon))) {
          const img = U.h("img", { src: s.favicon, alt: "", referrerpolicy: "no-referrer" });
          img.addEventListener("error", () => { img.remove(); mark.append(initial); });
          mark.append(img);
        } else mark.append(initial);
        const media = U.h("div", null, mark, U.h("div", { class: "signal", "aria-hidden": "true" }, U.h("i"), U.h("i"), U.h("i"), U.h("i"), U.h("i")));
        const threads = [];
        if (s.countrycode) threads.push({ label: "同じ国のほかの局", value: country, run: () => { st.thread = { kind: "country", code: s.countrycode, label: "国", value: country }; threadCtl.set(st.thread); dg.run(); } });
        tags.slice(0, 4).forEach((t) => threads.push({ label: "同じタグの局", value: t, run: () => { st.thread = { kind: "tag", label: "タグ", value: t }; threadCtl.set(st.thread); dg.run(); } }));
        const lang = String(s.language || "").split(",").filter(Boolean).slice(0, 3).join("、");
        const n = Number(s.clickcount || 0);
        const links = [];
        if (s.homepage && /^https?:/i.test(s.homepage)) links.push({ label: "局のホームページ", url: s.homepage });
        return {
          _station: s,
          id: "radio:" + s.stationuuid, room: "radio",
          kicker: [country, s.state, s.countrycode && st.mode === "dial" && !st.thread ? lonText(st.lon) : ""].filter(Boolean).join("／"),
          title: (s.name || "").trim() || "名前のない局",
          sub: tags.slice(0, 6).join(" / "),
          meta: [["国", country], ["地域", s.state], ["言語", lang], ["形式", [s.codec, s.bitrate ? s.bitrate + "kbps" : ""].filter(Boolean).join(" ")], ["票", s.votes ? U.num(s.votes) + "票" : ""]],
          media,
          image: s.favicon && /^https:/i.test(s.favicon) ? s.favicon : "",
          extra: relaxed ? U.h("p", { class: "room-note" }, relaxed === "down"
            ? "糸の先には" + LEVELS[st.depth].label + "より浅い局がなかったので、すぐ下の層の局を選んだ。"
            : "この辺りには" + LEVELS[st.depth].label + "の局がなかったので、それより少しよく聴かれている局を選んだ。") : null,
          metric: { value: n, unit: "人", label: "今日この局に合わせた人（Radio Browser 経由）", poem: n === 0 ? "今日この局に合わせたのは、あなたが最初。" : "今日" + (n + 1) + "人目の聴き手。" },
          links, url: s.homepage && /^https?:/i.test(s.homepage) ? s.homepage : "", urlLabel: "局のページへ",
          threads
        };
      }

      dg = U.digger({
        room: "radio", stage, trailHost,
        loadingText: () => "電波を探しています…",
        renderFind: (find, api) => U.findCard(find, { onNext: () => api.run(), nextLabel: "次の局を探す" }),
        onRestore: async (find) => {
          const s = find._station;
          if (!s) return;
          if (!st.on) togglePower(true, true);
          stat.level(0.18);
          status("合わせ直しています……" + (s.name || "").trim());
          const ok = await tryPlay(s, () => false);
          if (ok) { fadeIn(); status("受信中　" + (s.codec || "") + (s.bitrate ? " " + s.bitrate + "kbps" : ""), true); st.current = s; }
          else { stat.level(0.12); status("電波が届かない"); setTimeout(() => { if (stream.paused) stat.level(0, 0.8); }, 2600); }
        },
        dig: async (arg, stale) => {
          if (!st.on) togglePower(true, true);
          stat.level(0.18);
          status("探しています……");
          await loadCountries();
          if (stale()) return null;
          const { list, relaxed, bandEmpty } = await candidates();
          if (stale()) return null;
          if (!list.length && bandEmpty) {
            stat.level(0.12);
            status("この深さの局がない");
            setTimeout(() => { if (!stale() && stream.paused) stat.level(0, 0.8); }, 2600);
            return { notice: U.notice(LEVELS[st.depth].label + "の局が見つからなかった",
              (st.mode === "dial" && !st.thread ? "この経線の上には、" : "ここには、") + LEVELS[st.depth].label + "（" + LEVELS[st.depth].text + "）の局がなかった。" + (st.mode === "dial" && !st.thread ? "ダイヤルを回すか、" : "") + "深度を変えてみて。",
              [U.btn("もう一度探す", () => dg.run(), "btn-dig"), U.btn("でたらめに回す", () => spinTo(-180 + Math.random() * 360))]) };
          }
          for (const s of list.slice(0, 5)) {
            st.tried.add(s.stationuuid);
            status("合わせています……" + (s.name || "").trim());
            const ok = await tryPlay(s, stale);
            if (stale()) return null;
            if (ok) {
              fadeIn();
              status("受信中　" + (s.codec || "") + (s.bitrate ? " " + s.bitrate + "kbps" : ""), true);
              rb("/json/url/" + s.stationuuid).catch(() => {});
              st.current = s;
              return stationFind(s, relaxed);
            }
          }
          stat.level(0.12);
          status("電波が届かない");
          setTimeout(() => { if (!stale() && stream.paused) stat.level(0, 0.8); }, 2600);
          return { notice: U.notice("電波が届かなかった", st.mode === "dial" && !st.thread ? "この経線の上の局は、今は鳴らせなかった。ダイヤルを少し回すか、もう一度探してみて。" : "鳴らせる局が見つからなかった。もう一度探すか、探し方を変えてみて。",
            [U.btn("もう一度探す", () => dg.run(), "btn-dig"), U.btn("でたらめに回す", () => spinTo(-180 + Math.random() * 360))]) };
        }
      });

      renderDialState();
      loadCountries().catch((e) => status(U.errorText(e)));
    }
  };
  U.room(def);
})();

</script>
<script>
/* js/rooms/covers.js */
/* ジャケ — 名前も評判も伏せたジャケットから、一枚を選ぶ */
(function () {
  "use strict";
  const U = window.U;
  const MB = "https://musicbrainz.org/ws/2/";
  const CAA = "https://coverartarchive.org/";

  /* MusicBrainz は1秒に1回まで。順番待ちの列をつくる */
  let chain = Promise.resolve(), last = 0;
  function mb(path) {
    const run = async () => {
      const wait = Math.max(0, last + 1150 - Date.now());
      if (wait) await U.sleep(wait);
      last = Date.now();
      return U.fetchJSON(MB + path + (path.includes("?") ? "&" : "?") + "fmt=json", { source: "MusicBrainz", retries: 3, retryDelay: 1800, timeout: 20000 });
    };
    const p = chain.then(run, run);
    chain = p.catch(() => {});
    return p;
  }

  const DECADES = [["", "でたらめ"], ["1950", "1950年代"], ["1960", "1960年代"], ["1970", "1970年代"], ["1980", "1980年代"], ["1990", "1990年代"], ["2000", "2000年代"], ["2010", "2010年代"]];
  const COUNTRIES = ["JP", "US", "GB", "DE", "FR", "IT", "ES", "PT", "NL", "BE", "SE", "FI", "PL", "CZ", "HU", "GR", "TR", "IR", "EG", "NG", "GH", "SN", "ET", "ZA", "IN", "ID", "TH", "PH", "KR", "TW", "HK", "BR", "AR", "MX", "CO", "PE", "CU", "JM", "CA", "AU"];
  const FORMATS = [["", "でたらめ"], ["vinyl", "レコード"], ["cassette", "カセット"], ["cd", "CD"]];

  function loadImage(url, timeout) {
    return new Promise((resolve) => {
      const img = new Image();
      img.referrerPolicy = "no-referrer";
      let done = false;
      const t = setTimeout(() => { if (!done) { done = true; img.src = ""; resolve(null); } }, timeout || 9000);
      img.onload = () => { if (done) return; done = true; clearTimeout(t); resolve(img.naturalWidth > 20 ? url : null); };
      img.onerror = () => { if (done) return; done = true; clearTimeout(t); resolve(null); };
      img.src = url;
    });
  }
  async function coverOf(r) {
    const a = await loadImage(CAA + "release/" + r.id + "/front-250");
    if (a) return { thumb: a, big: CAA + "release/" + r.id + "/front-500" };
    if (r["release-group"] && r["release-group"].id) {
      const b = await loadImage(CAA + "release-group/" + r["release-group"].id + "/front-250");
      if (b) return { thumb: b, big: CAA + "release-group/" + r["release-group"].id + "/front-500" };
    }
    return null;
  }
  /* 並列に試し、want 枚そろったら打ち切る */
  async function collectCovers(releases, want, stale, onFound) {
    const found = [];
    let i = 0;
    async function worker() {
      while (i < releases.length && found.length < want && !stale()) {
        const r = releases[i++];
        const c = await coverOf(r);
        if (c && found.length < want && !stale()) { found.push({ r, c }); onFound(found.length); }
      }
    }
    await Promise.all(Array.from({ length: 8 }, worker));
    return found;
  }

  const artistOf = (r) => (r["artist-credit"] || []).map((a) => (a.name || (a.artist && a.artist.name) || "") + (a.joinphrase || "")).join("").trim();

  let api = null;
  const def = {
    id: "covers", name: "ジャケ", group: "聴く", lith: "lime",
    short: "名前を伏せた盤を選ぶ",
    title: "ジャケットだけで選ぶ",
    lede: "名前も評判も伏せたレコードやカセットのジャケットが並ぶ。目に留まった一枚を選んでから、正体を知る。",
    digger: () => api,
    mount(el) {
      const st = {
        decade: U.prefs.get("covers", "decade", ""),
        country: U.prefs.get("covers", "country", ""),
        format: U.prefs.get("covers", "format", ""),
        thread: null, crate: [], chosen: null
      };
      el.append(U.roomHead(def));

      const decadeSel = U.h("select", { class: "select", id: "covers-decade", "aria-label": "年代" }, DECADES.map(([v, l]) => U.h("option", { value: v, selected: v === st.decade }, l)));
      const countrySel = U.h("select", { class: "select", id: "covers-country", "aria-label": "国" },
        U.h("option", { value: "", selected: !st.country }, "でたらめ"),
        COUNTRIES.map((c) => U.h("option", { value: c, selected: c === st.country }, U.region(c))));
      const formatSel = U.h("select", { class: "select", id: "covers-format", "aria-label": "形" }, FORMATS.map(([v, l]) => U.h("option", { value: v, selected: v === st.format }, l)));
      const onSel = () => {
        st.decade = decadeSel.value; st.country = countrySel.value; st.format = formatSel.value;
        U.prefs.set("covers", "decade", st.decade); U.prefs.set("covers", "country", st.country); U.prefs.set("covers", "format", st.format);
      };
      [decadeSel, countrySel, formatSel].forEach((s) => s.addEventListener("change", onSel));
      const threadCtl = U.threadControl(() => { st.thread = null; threadCtl.set(null); api.run(); });
      const controls = U.h("div", { class: "controls" },
        U.h("div", { class: "control" }, U.h("span", { class: "label-cap" }, "箱"),
          U.h("div", { class: "control-body" },
            U.h("div", { class: "field-row" },
              U.h("label", { for: "covers-decade" }, "年代"), decadeSel,
              U.h("label", { for: "covers-country" }, "国"), countrySel,
              U.h("label", { for: "covers-format" }, "形"), formatSel,
              U.btn("箱を替える", () => api.run(), "btn-dig")),
            U.h("p", { class: "vein-note" }, "MusicBrainz に記録された世界中の盤から、条件に合うものをでたらめに並べる。人気も売上も関係ない。"))),
        threadCtl);
      const msg = U.h("p", { class: "crate-msg", "aria-live": "polite" });
      const crate = U.h("div", { class: "crate" });
      const reveal = U.h("div", { class: "reveal" });
      el.append(controls, msg, crate, reveal);

      let token = 0;
      function buildQuery() {
        if (st.thread) return st.thread.q;
        const parts = [];
        /* 検索は先頭500件までしかめくれないので、年を一年に絞って棚を小さくする */
        const dec = st.decade || U.pick(DECADES.slice(1))[0];
        parts.push("date:" + (Number(dec) + U.rand(10)));
        const cc = st.country || U.pick(COUNTRIES);
        parts.push("country:" + cc);
        if (st.format) parts.push("format:" + st.format);
        return parts.join(" AND ");
      }
      function describe(q) {
        if (st.thread) return st.thread.label + "：" + st.thread.value;
        const y = (q.match(/date:\[?(\d{4})/) || [])[1];
        const c = (q.match(/country:(\w+)/) || [])[1];
        const f = (q.match(/format:(\w+)/) || [])[1];
        return [c ? U.region(c) : "", y ? y + "年" : "", f ? (FORMATS.find((x) => x[0] === f) || ["", f])[1] : ""].filter(Boolean).join("・");
      }

      async function run() {
        const my = ++token;
        const stale = () => my !== token;
        st.chosen = null;
        U.clear(crate); U.clear(reveal);
        crate.append(U.digging("箱を探しています…"));
        msg.textContent = "";
        try {
          let releases = [], label = "";
          for (let attempt = 0; attempt < 4 && releases.length < 12; attempt++) {
            const q = buildQuery();
            label = describe(q);
            msg.textContent = label + " の棚を探しています…";
            const head = await mb("release/?query=" + encodeURIComponent(q) + "&limit=100&offset=0");
            if (stale()) return;
            const count = head.count || 0;
            if (count < 6 && !st.thread) continue;
            let list = head.releases || [];
            if (count > 100) {
              const off = U.rand(Math.min(count, 500) - 100 + 1);
              const page = await mb("release/?query=" + encodeURIComponent(q) + "&limit=100&offset=" + off);
              if (stale()) return;
              list = page.releases || list;
            }
            releases = U.shuffle(list);
            if (st.thread) break;
          }
          if (!releases.length) {
            U.clear(crate).append(U.notice("この棚は空っぽだった", "条件を少しゆるめて、もう一度。", [U.btn("箱を替える", () => api.run(), "btn-dig")]));
            msg.textContent = "";
            return;
          }
          msg.textContent = label + " の棚から、ジャケットのある盤を拾い出しています…";
          U.clear(crate);
          const found = await collectCovers(releases, 12, stale, (n) => { msg.textContent = label + " の棚から " + n + " 枚"; });
          if (stale()) return;
          if (!found.length) {
            U.clear(crate).append(U.notice("ジャケットの写真が一枚もなかった", "写真の残っていない盤ばかりの棚だった。箱を替えてみて。", [U.btn("箱を替える", () => api.run(), "btn-dig")]));
            msg.textContent = "";
            return;
          }
          st.crate = found;
          msg.textContent = label + " の棚から " + found.length + " 枚。名前は伏せてある。気になった一枚を選んで。";
          found.forEach(({ r, c }, i) => {
            const b = U.h("button", { type: "button", class: "sleeve", "aria-label": "ジャケット " + (i + 1) + " を選ぶ", on: { click: () => choose(i) } },
              U.h("img", { src: c.thumb, alt: "", referrerpolicy: "no-referrer" }));
            crate.append(b);
          });
        } catch (e) {
          if (stale()) return;
          console.error(e);
          msg.textContent = "";
          U.clear(crate).append(U.notice("箱を開けられなかった", U.errorText(e), [U.btn("もう一度", () => api.run(), "btn-dig")]));
        }
      }

      function choose(i) {
        const { r, c } = st.crate[i];
        st.chosen = i;
        U.$$(".sleeve", crate).forEach((b, j) => { b.classList.toggle("is-dim", j !== i); b.classList.toggle("is-chosen", j === i); });
        const artist = artistOf(r);
        const media = r.media || [];
        const fmt = Array.from(new Set(media.map((m) => m.format).filter(Boolean))).join("、");
        const tracks = media.reduce((n, m) => n + (m["track-count"] || 0), 0);
        const li = (r["label-info"] || []).find((x) => x.label) || (r["label-info"] || [])[0] || null;
        const labelName = li && li.label ? li.label.name : "";
        const rg = r["release-group"] || {};
        const q = (artist + " " + r.title).trim();
        const threads = [];
        const art = (r["artist-credit"] || [])[0];
        if (art && art.artist && art.artist.id && !/various artists/i.test(art.artist.name)) threads.push({ label: "同じアーティストの別の盤", value: art.artist.name, run: () => follow({ label: "アーティスト", value: art.artist.name, q: "arid:" + art.artist.id }) });
        if (li && li.label && li.label.id) threads.push({ label: "同じレーベルの別の盤", value: labelName, run: () => follow({ label: "レーベル", value: labelName, q: "laid:" + li.label.id }) });
        if (r.date && r.country) threads.push({ label: "同じ年・同じ国の箱", value: r.date.slice(0, 4) + "年 " + U.region(r.country), run: () => follow({ label: "年と国", value: r.date.slice(0, 4) + "年 " + U.region(r.country), q: "date:" + r.date.slice(0, 4) + " AND country:" + r.country }) });
        const find = {
          id: "mb:" + r.id, room: "covers",
          kicker: [U.region(r.country), (r.date || "").slice(0, 4), fmt].filter(Boolean).join("／"),
          title: r.title, sub: artist,
          image: c.thumb,
          media: U.h("img", { src: c.big, alt: r.title + " のジャケット", referrerpolicy: "no-referrer", on: { error: (e) => { e.target.src = c.thumb; } } }),
          meta: [["発売", r.date], ["国", U.region(r.country)], ["レーベル", labelName + (li && li["catalog-number"] ? "（" + li["catalog-number"] + "）" : "")], ["形", fmt], ["曲数", tracks ? tracks + "曲" : ""], ["種類", [rg["primary-type"], ...(rg["secondary-types"] || [])].filter(Boolean).join(" / ")], ["状態", r.status]],
          desc: "",
          extra: U.h("p", { class: "room-note" }, "選んだ理由は、ジャケットだけ。聴いてみて、思っていた音と同じだったか確かめてみて。"),
          links: [
            { label: "YouTubeで聴く", url: "https://www.youtube.com/results?search_query=" + encodeURIComponent(q) },
            { label: "Bandcamp", url: "https://bandcamp.com/search?q=" + encodeURIComponent(q) },
            { label: "Discogs", url: "https://www.discogs.com/search/?type=all&q=" + encodeURIComponent(q) },
            { label: "Spotify", url: "https://open.spotify.com/search/" + encodeURIComponent(q) },
            { label: "Apple Music", url: "https://music.apple.com/jp/search?term=" + encodeURIComponent(q) },
            { label: "ニコニコ", url: "https://www.nicovideo.jp/search/" + encodeURIComponent(q) }
          ],
          url: "https://musicbrainz.org/release/" + r.id, urlLabel: "MusicBrainz で見る",
          threads
        };
        st.current = find;
        U.clear(reveal);
        const card = U.findCard(find, { onNext: () => api.run(), nextLabel: "箱を替える" });
        reveal.append(card);
        api.cardEl = card;
        reveal.scrollIntoView({ behavior: window.matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });
      }
      function follow(thread) { st.thread = thread; threadCtl.set(thread); api.run(); }

      api = { run, keep: () => { if (api.cardEl && api.cardEl.openKeep) api.cardEl.openKeep(); }, cardEl: null };
      run();
    }
  };
  U.room(def);
})();

</script>
<script>
/* js/rooms/video.js */
/* 映像 — アーカイブの古い映像と、誰かが撮ったまま投稿した動画 */
(function () {
  "use strict";
  const U = window.U;

  const VEINS = [
    { id: "vhs", label: "VHSの山", note: "家庭や会社で録られたビデオテープを、誰かが取り込んだもの。", q: "collection:vhsvault", levels: [1000, 100, 20, 5] },
    { id: "home", label: "誰かのホームムービー", note: "8ミリや16ミリで撮られた、どこかの家族の記録。", q: "collection:(prelingerhomemovies OR home_movies OR centerforhomemovies OR memoriestolight)", levels: [2000, 300, 80, 30] },
    { id: "cm", label: "古いテレビCM", note: "放送の合間に流れて、消えていった広告。", q: "collection:(classic_tv_commercials OR vhscommercials OR classic_tv_commercials_emperor)", levels: [2000, 300, 60, 20] },
    { id: "pa", label: "町のケーブルテレビ", note: "アメリカの小さな町の、住民がつくる公共チャンネル。", q: "collection:(bptvpa OR lpama OR apatvme OR pandatv23ny OR wehoca OR pacbny)", levels: [500, 50, 10, 2] },
    { id: "eph", label: "記録映画", note: "教育映画や企業のPR映画。プリンガー・アーカイブより。", q: "collection:prelinger", levels: [5000, 1000, 300, 100] },
    { id: "community", label: "誰かの動画", note: "誰でも動画を預けられる棚。何が出るかわからない。", q: "collection:opensource_movies", levels: [1000, 50, 5, 0] }
  ];
  const DEPTH_NAMES = U.DEPTH_NAMES;
  const levelsOf = (v) => U.depthBands(v.levels);
  const VIDEO_FORMATS = ["h.264", "MPEG4", "512Kb MPEG4", "h.264 IA", "H.264", "Ogg Video", "WebM"];

  function pickVideo(files) {
    const vids = files.filter((f) => VIDEO_FORMATS.includes(f.format) && /\.(mp4|m4v|ogv|webm)$/i.test(f.name));
    vids.sort((a, b) => VIDEO_FORMATS.indexOf(a.format) - VIDEO_FORMATS.indexOf(b.format) || (Number(a.size) || 0) - (Number(b.size) || 0));
    return vids[0] || null;
  }

  /* ---------- 骰子：カメラやスマホが自動でつける名前 ---------- */
  const pad = (n, w) => String(n).padStart(w, "0");
  function stamp() {
    const y = U.randInt(2009, 2024), m = U.randInt(1, 12), d = U.randInt(1, 28);
    const h = U.randInt(0, 23), mi = U.randInt(0, 59), s = U.randInt(0, 59);
    return { y, m: pad(m, 2), d: pad(d, 2), h: pad(h, 2), mi: pad(mi, 2), s: pad(s, 2) };
  }
  const NAMERS = [
    ["iPhone", () => "IMG " + pad(U.randInt(1, 9999), 4)],
    ["iPhone", () => "IMG_" + pad(U.randInt(1, 9999), 4) + " MOV"],
    ["Android", () => { const t = stamp(); return "VID " + t.y + t.m + t.d + " " + t.h + t.mi + t.s; }],
    ["Galaxy", () => { const t = stamp(); return t.y + t.m + t.d + " " + t.h + t.mi + t.s; }],
    ["Pixel", () => { const t = stamp(); return "PXL " + t.y + t.m + t.d + " " + t.h + t.mi + t.s + pad(U.randInt(0, 999), 3); }],
    ["キヤノンのデジカメ", () => "MVI " + pad(U.randInt(1, 9999), 4)],
    ["ニコンやソニーのカメラ", () => "DSC " + pad(U.randInt(1, 9999), 4)],
    ["古いデジカメ", () => "DSCN" + pad(U.randInt(1, 9999), 4)],
    ["GoPro", () => "GOPR" + pad(U.randInt(1, 9999), 4)],
    ["ドローン", () => "DJI " + pad(U.randInt(1, 999), 4)],
    ["Windows のカメラ", () => { const t = stamp(); return "WIN " + t.y + t.m + t.d + " " + t.h + " " + t.mi + " " + t.s + " Pro"; }],
    ["Mac の画面収録", () => { const t = stamp(); return "画面収録 " + t.y + "-" + t.m + "-" + t.d; }],
    ["iPhone の画面収録", () => "RPReplay Final" + (1500000000 + U.rand(200000000))]
  ];

  let dg = null, mode = "archive";
  const def = {
    id: "video", name: "映像", group: "観る", lith: "cong",
    short: "誰も見ていない映像",
    title: "誰も見ていない映像",
    lede: "アーカイブに預けられたまま見られていない映像と、誰かが撮ってそのまま投稿した動画を掘る。",
    digger: () => (mode === "archive" ? dg : null),
    mount(el) {
      const st = { vein: U.prefs.get("video", "vein", "vhs"), depth: U.prefs.get("video", "depth", 2), thread: null };
      if (!VEINS.some((v) => v.id === st.vein)) st.vein = "vhs";
      const veinOf = () => VEINS.find((v) => v.id === st.vein);
      el.append(U.roomHead(def));

      const tabArchive = U.h("button", { type: "button", class: "subtab", role: "tab", "aria-selected": "true", id: "video-tab-a", "aria-controls": "video-panel-a" }, "アーカイブの映像");
      const tabDice = U.h("button", { type: "button", class: "subtab", role: "tab", "aria-selected": "false", id: "video-tab-d", "aria-controls": "video-panel-d" }, "誰かが撮ったままの動画");
      const panelA = U.h("div", { id: "video-panel-a", role: "tabpanel", "aria-labelledby": "video-tab-a" });
      const panelD = U.h("div", { id: "video-panel-d", role: "tabpanel", "aria-labelledby": "video-tab-d", hidden: true });
      function setTab(m) {
        mode = m;
        tabArchive.setAttribute("aria-selected", String(m === "archive"));
        tabDice.setAttribute("aria-selected", String(m === "dice"));
        panelA.hidden = m !== "archive"; panelD.hidden = m !== "dice";
        U.prefs.set("video", "tab", m);
      }
      tabArchive.addEventListener("click", () => setTab("archive"));
      tabDice.addEventListener("click", () => setTab("dice"));
      el.append(U.h("div", { class: "subtabs", role: "tablist" }, tabArchive, tabDice), panelA, panelD);

      /* ---------- アーカイブ ---------- */
      const veins = U.veins({ items: VEINS, value: st.vein, onChange: (v) => { st.vein = v; st.thread = null; threadCtl.set(null); U.prefs.set("video", "vein", v); depth.setLevels(levelsOf(veinOf()), st.depth); dg.run(); } });
      const depth = U.depth({ levels: levelsOf(veinOf()), value: st.depth, unit: "回", onChange: (i) => { st.depth = i; U.prefs.set("video", "depth", i); dg.run(); } });
      const threadCtl = U.threadControl(() => { st.thread = null; threadCtl.set(null); dg.run(); });
      const stage = U.h("div", { class: "dig-site" });
      const trailHost = U.h("div");
      panelA.append(U.h("div", { class: "controls" }, veins, depth, threadCtl), stage, trailHost);

      async function buildFind(doc, vein) {
        const id = doc.identifier;
        const meta = await U.ia.meta(id);
        if (!meta || !meta.files || meta.is_dark) return null;
        const vf = pickVideo(meta.files);
        if (!vf) return null;
        const md = meta.metadata || {};
        const title = U.first(md.title) || U.first(doc.title) || id;
        const year = U.first(md.year) || (U.first(md.date) || "").slice(0, 4);
        const poster = U.ia.image(id, meta.files) || U.ia.base + "/services/img/" + encodeURIComponent(id);
        const video = U.h("video", { class: "video-frame", controls: true, preload: "metadata", playsinline: true, poster, src: U.ia.fileURL(id, vf.name) });
        if (U.nowPlaying) U.nowPlaying.tag(video, { room: "video", title, sub: [vein.label, year, U.joinList(md.creator)].filter(Boolean).join("／"), art: poster });
        const shelves = U.list(md.collection).filter((c) => !U.ia.BIG.test(c));
        const subjects = U.list(md.subject).flatMap((s) => String(s).split(/;\s*/)).filter(Boolean).slice(0, 5);
        const downloads = Number(doc.downloads || 0);
        const threads = [];
        const add = (label, value, q) => threads.push({ label, value, run: () => { st.thread = { label, value, q }; threadCtl.set(st.thread); dg.run(); } });
        if (md.creator) add("同じ作り手", U.first(md.creator), "creator:" + U.luceneQuote(U.first(md.creator)));
        if (/^\d{4}$/.test(year)) add("同じ年", year + "年", "year:" + year);
        if (shelves[0]) add("同じ小さな棚", shelves[0], "collection:" + U.luceneQuote(shelves[0]));
        if (subjects[0]) add("同じ主題", subjects[0], "subject:" + U.luceneQuote(subjects[0]));
        return {
          id: "ia:" + id, room: "video", wide: true,
          kicker: [vein.label, year, U.iaLang(md.language)].filter(Boolean).join("／"),
          title, sub: U.joinList(md.creator),
          media: video, image: poster,
          meta: [["年", year], ["長さ", vf.length ? U.duration(U.parseLength(vf.length)) : ""], ["主題", subjects.join("、")], ["棚", shelves.slice(0, 3).join("、")]],
          desc: U.truncate(U.stripHTML(U.first(md.description)), 900),
          metric: { value: downloads, unit: "回", label: "archive.org での再生・ダウンロード", poem: downloads === 0 ? "まだ誰にも見られていない。最初の観客は、あなた。" : (downloads + 1) + "人目の観客は、あなた。" },
          url: U.ia.base + "/details/" + encodeURIComponent(id), urlLabel: "Internet Archive で開く",
          threads
        };
      }

      dg = U.digger({
        room: "video", stage, trailHost,
        loadingText: () => (st.thread ? "糸をたどって掘っています…" : veinOf().label + "の" + DEPTH_NAMES[st.depth] + "を掘っています…"),
        renderFind: (find, api) => U.findCard(find, { onNext: () => api.run() }),
        dig: async (arg, stale) => {
          const vein = veinOf();
          const base = st.thread ? "mediatype:movies AND " + st.thread.q : vein.q;
          for (const step of U.depthSteps(levelsOf(vein), st.depth, !!st.thread)) {
            const q = base + U.bandQuery("downloads", step.band) + " AND NOT title:(iptv OR m3u)";
            for (let attempt = 0; attempt < 2; attempt++) {
              const { n, docs } = await U.ia.randomDocs(q, "");
              if (stale()) return null;
              if (!n) break;
              const cands = U.shuffle(docs.filter((d) => !U.ia.JUNK.test(String(U.first(d.title) || d.identifier))));
              for (const doc of cands.slice(0, 4)) {
                const find = await buildFind(doc, vein);
                if (stale()) return null;
                if (find) {
                  if (step.note) find.extra = U.h("p", { class: "room-note" }, step.note);
                  return find;
                }
              }
            }
          }
          return { notice: U.notice("何も掘り出せなかった", "この鉱脈は今、手応えがない。別の鉱脈か、浅い層で試してみて。", [U.btn("もう一度掘る", () => dg.run(), "btn-dig")]) };
        }
      });

      /* ---------- 骰子 ---------- */
      const nameEl = U.h("p", { class: "dice-name", "aria-live": "polite" });
      const whoEl = U.h("p", { class: "dice-note" });
      const ytLink = U.h("a", { class: "btn btn-dig", target: "_blank", rel: "noopener noreferrer" }, "YouTube でこの名前を探す", U.h("span", { class: "sr-only" }, "（新しいタブで開く）"));
      const wordEl = U.h("p", { class: "dice-name" });
      const nicoLink = U.h("a", { class: "btn btn-dig", target: "_blank", rel: "noopener noreferrer" }, "ニコニコで、再生の少ない順に見る", U.h("span", { class: "sr-only" }, "（新しいタブで開く）"));
      function rollName() {
        const [who, fn] = U.pick(NAMERS);
        const name = fn();
        nameEl.textContent = name;
        whoEl.textContent = who + " が撮った動画に、自動でつく名前。名前を変えずに投稿された動画は、たいてい撮った本人と家族くらいしか見ていない。";
        ytLink.href = "https://www.youtube.com/results?search_query=" + encodeURIComponent('"' + name + '"');
      }
      function rollWord() {
        const w = U.pick(window.UMO_DATA.everydayWords);
        wordEl.textContent = w;
        nicoLink.href = "https://www.nicovideo.jp/search/" + encodeURIComponent(w) + "?sort=v&order=a";
      }
      panelD.append(
        U.h("div", { class: "dice-box" },
          U.h("p", { class: "eyebrow" }, "骰子 一 ／ 撮ったままの名前"),
          nameEl, whoEl,
          U.h("div", { class: "dice-row" }, ytLink, U.btn("もう一度振る", rollName))),
        U.h("div", { class: "dice-box", style: { marginTop: "16px" } },
          U.h("p", { class: "eyebrow" }, "骰子 二 ／ ありふれた言葉"),
          wordEl,
          U.h("p", { class: "dice-note" }, "ありふれた言葉でニコニコ動画を探し、再生数の少ない順に並べる。一番上には、まだ誰も再生していない動画がある。"),
          U.h("div", { class: "dice-row" }, nicoLink, U.btn("もう一度振る", rollWord))),
        U.h("p", { class: "room-note" }, "見つけた動画は、標本箱の「外で見つけたものを書き留める」から残せる。", " ",
          U.h("button", { type: "button", class: "link-btn", on: { click: () => U.openManual && U.openManual({ room: "video" }) } }, "いま書き留める")));
      rollName(); rollWord();

      setTab(U.prefs.get("video", "tab", "archive"));
      dg.run();
    }
  };
  U.room(def);
})();

</script>
<script>
/* js/rooms/storage.js */
/* 収蔵庫 — 美術館や博物館の、いま展示されていないもの */
(function () {
  "use strict";
  const U = window.U;
  const D = window.UMO_DATA;
  const JPS = "https://jpsearch.go.jp/api/";
  const MET = "https://collectionapi.metmuseum.org/public/collection/";
  const CMA = "https://openaccess-api.clevelandart.org/api/";

  const SOURCES = [
    { id: "jp", label: "日本の収蔵品", note: "ジャパンサーチ。全国の博物館・美術館・図書館・文書館の所蔵品を横断する。" },
    { id: "met", label: "メトロポリタン美術館", note: "ニューヨーク。今は展示室に出ていないものだけを選ぶ。" },
    { id: "cma", label: "クリーブランド美術館", note: "オハイオ州。今は展示室に出ていないものだけを選ぶ。" }
  ];

  const dbNames = new Map();
  async function dbName(db) {
    if (!db) return "";
    if (dbNames.has(db)) return dbNames.get(db);
    try {
      const d = await U.fetchJSON(JPS + "database/" + encodeURIComponent(db), { source: "ジャパンサーチ", retries: 0, timeout: 8000 });
      const n = (d.name && (d.name.ja || d.name.en)) || db;
      dbNames.set(db, n);
      return n;
    } catch (e) { return db; }
  }
  const isImg = (u) => /\.(jpe?g|png|gif|webp)(\?|$)/i.test(u || "") || /\/iiif\/|\/media\/|image/i.test(u || "");

  let dg = null;
  const def = {
    id: "storage", name: "収蔵庫", group: "観る", lith: "granite",
    short: "展示されていない収蔵品",
    title: "収蔵庫で眠っているもの",
    lede: "でたらめな鍵語で、美術館や博物館の収蔵品から一点を引き出す。多くは今、誰の目にも触れていない。",
    digger: () => dg,
    mount(el) {
      const st = { src: U.prefs.get("storage", "src", "jp"), era: U.prefs.get("storage", "era", ""), keyword: "", lockKeyword: false, thread: null };
      if (!SOURCES.some((s) => s.id === st.src)) st.src = "jp";
      el.append(U.roomHead(def));
      const srcCtl = U.veins({ items: SOURCES, value: st.src, label: "収蔵先", onChange: (v) => { st.src = v; st.thread = null; threadCtl.set(null); U.prefs.set("storage", "src", v); eraRow.hidden = v !== "jp"; dg.run(); } });
      const eraSel = U.h("select", { class: "select", id: "storage-era", "aria-label": "時代" }, D.jpsEras.map(([v, l]) => U.h("option", { value: v, selected: v === st.era }, l)));
      eraSel.addEventListener("change", () => { st.era = eraSel.value; U.prefs.set("storage", "era", st.era); dg.run(); });
      const kwInput = U.h("input", { type: "text", class: "text-input", id: "storage-kw", placeholder: "空欄なら、でたらめな鍵語", autocomplete: "off", style: { width: "14em" } });
      const kwForm = U.h("form", { class: "field-row", on: { submit: (e) => { e.preventDefault(); st.lockKeyword = !!kwInput.value.trim(); st.keyword = kwInput.value.trim(); dg.run(); } } },
        U.h("label", { for: "storage-kw", class: "sr-only" }, "鍵語"), kwInput, U.h("button", { type: "submit", class: "btn" }, "この言葉で引き出す"));
      const eraRow = U.h("div", { class: "control", hidden: st.src !== "jp" }, U.h("span", { class: "label-cap" }, "時代"), U.h("div", { class: "control-body" }, U.h("div", { class: "field-row" }, eraSel)));
      const threadCtl = U.threadControl(() => { st.thread = null; threadCtl.set(null); dg.run(); });
      const stage = U.h("div", { class: "dig-site" });
      const trailHost = U.h("div");
      el.append(U.h("div", { class: "controls" }, srcCtl, eraRow,
        U.h("div", { class: "control" }, U.h("span", { class: "label-cap" }, "鍵語"), U.h("div", { class: "control-body" }, kwForm,
          U.h("p", { class: "vein-note" }, "空にしておくと、毎回ちがう言葉で引き出す。海外の収蔵庫に自分で鍵語を入れるときは英語で（例：moon、spoon）。"))),
        threadCtl), stage, trailHost);

      /* ---------- 日本：ジャパンサーチ ---------- */
      async function digJP(stale) {
        for (let attempt = 0; attempt < 4; attempt++) {
          const kw = st.thread && st.thread.kw ? st.thread.kw : (st.lockKeyword ? st.keyword : U.pick(D.jpsKeywords));
          const params = { keyword: kw, "f-contents": "image", size: 20 };
          if (st.era && !(st.thread && st.thread.db)) params["f-tempo"] = st.era;
          if (st.thread && st.thread.db) params["f-db"] = st.thread.db;
          const base = JPS + "item/search/jps-cross?" + U.query(params);
          const first = await U.fetchJSON(base + "&from=0", { source: "ジャパンサーチ", retries: 1 });
          if (stale()) return null;
          const hit = first.hit || 0;
          if (!hit) { if (st.lockKeyword || (st.thread && st.thread.kw)) break; continue; }
          const maxFrom = Math.max(0, Math.min(hit, 1000) - 20);
          const from = U.rand(maxFrom + 1);
          const d = from === 0 ? first : await U.fetchJSON(base + "&from=" + from, { source: "ジャパンサーチ", retries: 1 });
          if (stale()) return null;
          const items = U.shuffle((d.list || []).filter((it) => it.common && (U.first(it.common.thumbnailUrl) || isImg(U.first(it.common.contentsUrl)))));
          if (!items.length) continue;
          const it = items[0], c = it.common;
          const big = U.list(c.contentsUrl).find((u) => /\.(jpe?g|png)(\?|$)/i.test(u));
          const image = big || U.first(c.thumbnailUrl);
          const museum = await dbName(c.database);
          if (stale()) return null;
          const contributors = U.list(c.contributor).filter((x) => !/^(By |Gift of )/.test(x)).slice(0, 4);
          const threads = [
            { label: "同じ鍵語でもう一点", value: kw, run: () => { st.thread = { label: "鍵語", value: kw, kw }; threadCtl.set(st.thread); dg.run(); } }
          ];
          if (c.database) threads.push({ label: "同じ館・同じ棚から", value: museum, run: () => { st.thread = { label: "収蔵先", value: museum, db: c.database, kw }; threadCtl.set(st.thread); dg.run(); } });
          return {
            id: "jps:" + it.id, room: "storage",
            kicker: [museum, U.joinList(c.temporal)].filter(Boolean).join("／"),
            title: c.title || "（名前のない収蔵品）",
            sub: contributors.join("、"),
            image, imageAlt: c.title || "",
            meta: [["時代", U.joinList(c.temporal)], ["収蔵先", museum], ["鍵語", kw]],
            desc: U.truncate(U.stripHTML(c.description), 900),
            extra: U.h("p", { class: "room-note" }, "鍵語「" + kw + "」で" + U.num(hit) + "点が見つかり、そのうちの" + (from + 1) + "番目あたりから引き出した。"),
            links: c.linkUrl ? [{ label: "所蔵館のページ", url: c.linkUrl }] : [],
            url: "https://jpsearch.go.jp/item/" + encodeURIComponent(it.id), urlLabel: "ジャパンサーチで開く",
            threads
          };
        }
        return { notice: U.notice("この言葉では何も出てこなかった", "鍵語や時代を変えて、もう一度。", [U.btn("もう一度引き出す", () => dg.run(), "btn-dig")]) };
      }

      /* ---------- メトロポリタン美術館 ---------- */
      async function digMet(stale) {
        for (let attempt = 0; attempt < 3; attempt++) {
          const [kw, ja] = st.thread && st.thread.mkw ? st.thread.mkw : (st.lockKeyword ? [st.keyword, st.keyword] : U.pick(D.museumKeywords));
          const s1 = await U.fetchJSON(MET + "v1.1/search?" + U.query({ q: kw, hasImages: "true", limit: 40, offset: 0 }), { source: "メトロポリタン美術館", retries: 1 });
          if (stale()) return null;
          const total = s1.total || 0;
          if (!total) { if (st.lockKeyword) break; continue; }
          const off = U.rand(Math.max(0, Math.min(total, 9960) - 40) + 1);
          const s2 = off ? await U.fetchJSON(MET + "v1.1/search?" + U.query({ q: kw, hasImages: "true", limit: 40, offset: off }), { source: "メトロポリタン美術館", retries: 1 }) : s1;
          if (stale()) return null;
          const ids = U.shuffle(s2.objectIDs || s1.objectIDs || []).slice(0, 10);
          let fallback = null;
          for (const id of ids) {
            let o;
            try { o = await U.fetchJSON(MET + "v1/objects/" + id, { source: "メトロポリタン美術館", retries: 0, timeout: 10000 }); } catch (e) { continue; }
            if (stale()) return null;
            if (!o || !o.primaryImageSmall) continue;
            if (!o.GalleryNumber) return metFind(o, kw, ja, total, false);
            if (!fallback) fallback = o;
          }
          if (fallback) return metFind(fallback, kw, ja, total, true);
        }
        return { notice: U.notice("収蔵庫の扉が開かなかった", "もう一度引き出してみて。", [U.btn("もう一度引き出す", () => dg.run(), "btn-dig")]) };
      }
      function metFind(o, kw, ja, total, onView) {
        const since = o.accessionYear && /^\d{4}$/.test(o.accessionYear) ? new Date().getFullYear() - Number(o.accessionYear) : null;
        return {
          id: "met:" + o.objectID, room: "storage",
          kicker: ["メトロポリタン美術館", o.department].filter(Boolean).join("／"),
          title: o.title || "（名前のない収蔵品）",
          sub: [o.artistDisplayName, o.culture].filter(Boolean).join("、"),
          image: o.primaryImageSmall, imageAlt: o.title || "",
          meta: [["年代", o.objectDate], ["文化", o.culture], ["素材", o.medium], ["大きさ", U.truncate(o.dimensions || "", 80)], ["収蔵", o.accessionYear ? o.accessionYear + "年" + (since ? "（" + since + "年前）" : "") : ""], ["鍵語", ja === kw ? kw : kw + "（" + ja + "）"]],
          desc: o.creditLine ? "来歴：" + o.creditLine : "",
          extra: U.h("p", { class: "metric-poem" }, onView ? "これは今、展示室に出ている。収蔵庫の作品は今回は見つからなかった。" : "今は展示室に出ていない。収蔵庫の棚で眠っている。"),
          url: o.objectURL, urlLabel: "美術館のページで見る",
          threads: [{ label: "同じ鍵語でもう一点", value: kw, run: () => { st.thread = { label: "鍵語", value: kw, mkw: [kw, ja] }; threadCtl.set(st.thread); dg.run(); } }]
        };
      }

      /* ---------- クリーブランド美術館 ---------- */
      async function digCMA(stale) {
        for (let attempt = 0; attempt < 3; attempt++) {
          const [kw, ja] = st.thread && st.thread.mkw ? st.thread.mkw : (st.lockKeyword ? [st.keyword, st.keyword] : U.pick(D.museumKeywords));
          const q = (skip) => CMA + "artworks/?" + U.query({ q: kw, has_image: 1, limit: 40, skip });
          const first = await U.fetchJSON(q(0), { source: "クリーブランド美術館", retries: 2, timeout: 26000 });
          if (stale()) return null;
          const total = (first.info && first.info.total) || 0;
          if (!total) { if (st.lockKeyword) break; continue; }
          const skip = U.rand(Math.max(1, total - 40) + 1);
          const d = skip === 0 ? first : await U.fetchJSON(q(skip), { source: "クリーブランド美術館", retries: 2, timeout: 26000 });
          if (stale()) return null;
          const all = (d.data || []).filter((x) => x.images && x.images.web && x.images.web.url);
          const asleep = U.shuffle(all.filter((x) => !x.current_location));
          const o = asleep[0] || U.shuffle(all)[0];
          if (!o) continue;
          const onView = !!o.current_location;
          const creators = (o.creators || []).map((c) => c.description).filter(Boolean).slice(0, 3).join("、");
          return {
            id: "cma:" + o.id, room: "storage",
            kicker: ["クリーブランド美術館", o.department].filter(Boolean).join("／"),
            title: o.title || "（名前のない収蔵品）",
            sub: creators || U.joinList(o.culture),
            image: o.images.web.url, imageAlt: o.title || "",
            meta: [["年代", o.creation_date], ["文化", U.joinList(o.culture)], ["技法・素材", U.truncate(o.technique || "", 120)], ["種類", o.type], ["大きさ", U.truncate(o.measurements || "", 80)], ["鍵語", kw === ja ? kw : kw + "（" + ja + "）"]],
            desc: U.truncate(o.wall_description || o.description || (o.creditline ? "来歴：" + o.creditline : ""), 900),
            extra: U.h("p", { class: "metric-poem" }, onView ? "これは今、展示室に出ている（" + o.current_location + "）。" : "今は展示室に出ていない。収蔵庫の棚で眠っている。"),
            url: o.url, urlLabel: "美術館のページで見る",
            threads: [{ label: "同じ鍵語でもう一点", value: kw, run: () => { st.thread = { label: "鍵語", value: kw, mkw: [kw, ja] }; threadCtl.set(st.thread); dg.run(); } }]
          };
        }
        return { notice: U.notice("収蔵庫の扉が開かなかった", "もう一度引き出してみて。", [U.btn("もう一度引き出す", () => dg.run(), "btn-dig")]) };
      }

      dg = U.digger({
        room: "storage", stage, trailHost,
        loadingText: () => "収蔵庫の棚を探しています…",
        renderFind: (find, api) => U.findCard(find, { onNext: () => api.run(), nextLabel: "次を引き出す" }),
        dig: (arg, stale) => (st.src === "met" ? digMet(stale) : st.src === "cma" ? digCMA(stale) : digJP(stale))
      });
      dg.run();
    }
  };
  U.room(def);
})();

</script>
<script>
/* js/rooms/pages.js */
/* 頁 — Wikipedia で、この30日いちばん読まれなかった頁 */
(function () {
  "use strict";
  const U = window.U;
  const D = window.UMO_DATA;
  const SRC = "Wikipedia";

  const api = (lang, params) => U.fetchJSON("https://" + lang + ".wikipedia.org/w/api.php?" + U.query(Object.assign({ format: "json", formatversion: 2, origin: "*" }, params)), { source: SRC, retries: 1 });
  const summary = (lang, title) => U.fetchJSON("https://" + lang + ".wikipedia.org/api/rest_v1/page/summary/" + encodeURIComponent(title.replace(/ /g, "_")), { source: SRC, retries: 1 });

  /* 閲覧数は20件ずつ問い合わせる（多すぎると途中で切られる） */
  async function pageviews(lang, titles) {
    const out = new Map();
    for (let i = 0; i < titles.length; i += 20) {
      const batch = titles.slice(i, i + 20);
      let cont = {};
      for (let k = 0; k < 5; k++) {
        const d = await api(lang, Object.assign({ action: "query", prop: "pageviews", pvipdays: 30, titles: batch.join("|"), redirects: 1 }, cont));
        ((d.query && d.query.pages) || []).forEach((p) => { if (p.pageviews && !p.missing) out.set(p.title, p.pageviews); });
        if (!d.continue || !d.continue.pvipcontinue) break;
        cont = d.continue;
      }
    }
    return out;
  }
  const total = (days) => Object.values(days || {}).reduce((a, v) => a + (v || 0), 0);

  async function categoryPool(lang, cat, depth) {
    const pool = [];
    let current = cat;
    for (let level = 0; level <= depth; level++) {
      const d = await api(lang, { action: "query", list: "categorymembers", cmtitle: current, cmlimit: 500, cmtype: "page|subcat" });
      const members = (d.query && d.query.categorymembers) || [];
      const pages = members.filter((m) => m.ns === 0).map((m) => m.title);
      const subs = members.filter((m) => m.ns === 14).map((m) => m.title);
      pool.push(...pages);
      if (!subs.length || (pool.length > 30 && Math.random() < 0.4)) break;
      current = U.pick(subs);
    }
    return Array.from(new Set(pool));
  }

  function spark(days) {
    const entries = Object.entries(days || {}).sort((a, b) => a[0].localeCompare(b[0]));
    const max = Math.max(1, ...entries.map(([, v]) => v || 0));
    const wrap = U.h("div", { "aria-hidden": "true" },
      U.h("div", { class: "spark" }, entries.map(([d, v]) => U.h("i", { class: v ? "" : "is-zero", title: d + "：" + (v || 0) + "回", style: { height: Math.max(2, ((v || 0) / max) * 34) + "px" } }))),
      U.h("div", { class: "spark-cap" }, U.h("span", null, entries.length ? entries[0][0].slice(5).replace("-", "/") : ""), U.h("span", null, "一日ごとの閲覧"), U.h("span", null, entries.length ? entries[entries.length - 1][0].slice(5).replace("-", "/") : "")));
    return wrap;
  }

  function km(lat1, lon1, lat2, lon2) {
    const R = 6371, toR = (x) => (x * Math.PI) / 180;
    const a = Math.sin(toR(lat2 - lat1) / 2) ** 2 + Math.cos(toR(lat1)) * Math.cos(toR(lat2)) * Math.sin(toR(lon2 - lon1) / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(a));
  }

  U.wiki = { api, summary, pageviews, categoryPool, total };

  const VEINS = [
    { id: "ja", label: "でたらめ（日本語）", note: "日本語版の頁を20ほどでたらめに拾い、いちばん読まれていないものを残す。" },
    { id: "en", label: "でたらめ（英語）", note: "英語版から同じように拾う。" },
    { id: "topic", label: "主題から", note: "趣味、工芸、郷土料理……分類の奥へ潜って、読まれていない頁を探す。" },
    { id: "near", label: "近くの場所", note: "ある地点から10km以内の、誰も気に留めない場所の頁。" }
  ];
  const LEVELS = U.depthBands([3000, 300, 30, 3]);

  let dg = null;
  const def = {
    id: "pages", name: "頁", group: "読む", lith: "tuff",
    short: "読まれない頁",
    title: "誰にも読まれていない頁",
    lede: "Wikipedia の頁をいくつか拾い上げ、この30日でいちばん読まれなかったものを残す。誰かが書いて、ほとんど誰も読んでいない頁。",
    digger: () => dg,
    mount(el) {
      const st = {
        vein: U.prefs.get("pages", "vein", "ja"),
        depth: U.prefs.get("pages", "depth", 2),
        topic: U.prefs.get("pages", "topic", ""),
        place: U.prefs.get("pages", "place", null), thread: null
      };
      if (!VEINS.some((v) => v.id === st.vein)) st.vein = "ja";
      el.append(U.roomHead(def));
      const veins = U.veins({ items: VEINS, value: st.vein, onChange: (v) => { st.vein = v; st.thread = null; threadCtl.set(null); U.prefs.set("pages", "vein", v); syncRows(); if (v !== "near" || st.place) dg.run(); else showNearStart(); } });
      const depth = U.depth({ levels: LEVELS, value: st.depth, unit: "回", label: "深度", onChange: (i) => { st.depth = i; U.prefs.set("pages", "depth", i); dg.run(); } });
      const topicSel = U.h("select", { class: "select", id: "pages-topic", "aria-label": "主題" },
        U.h("option", { value: "", selected: !st.topic }, "でたらめ"),
        D.wikiTopics.map(([cat, label]) => U.h("option", { value: cat, selected: cat === st.topic }, label)));
      topicSel.addEventListener("change", () => { st.topic = topicSel.value; U.prefs.set("pages", "topic", st.topic); dg.run(); });
      const topicRow = U.h("div", { class: "control" }, U.h("span", { class: "label-cap" }, "主題"), U.h("div", { class: "control-body" }, U.h("div", { class: "field-row" }, topicSel)));
      const placeInput = U.h("input", { type: "text", class: "text-input", id: "pages-place", placeholder: "地名（例：尾道、小樽）", autocomplete: "off" });
      const placeNote = U.h("p", { class: "vein-note" });
      const placeRow = U.h("div", { class: "control" }, U.h("span", { class: "label-cap" }, "地点"), U.h("div", { class: "control-body" },
        U.h("form", { class: "field-row", on: { submit: (e) => { e.preventDefault(); setPlaceByName(placeInput.value.trim()); } } },
          U.btn("いまいる場所", () => setPlaceHere()), U.h("span", null, "または"), placeInput, U.h("button", { type: "submit", class: "btn" }, "この地名で")),
        placeNote));
      const threadCtl = U.threadControl(() => { st.thread = null; threadCtl.set(null); dg.run(); });
      function syncRows() { topicRow.hidden = st.vein !== "topic"; placeRow.hidden = st.vein !== "near"; }
      const stage = U.h("div", { class: "dig-site" });
      const trailHost = U.h("div");
      el.append(U.h("div", { class: "controls" }, veins, topicRow, placeRow, depth, threadCtl), stage, trailHost);
      syncRows();

      function showNearStart() {
        U.clear(stage).append(U.h("div", { class: "start-panel" },
          U.h("p", null, "今いる場所か、どこかの地名を決めると、そこから10km以内の頁の中で、いちばん読まれていないものを探す。"),
          U.h("div", { class: "field-row" }, U.btn("いまいる場所から", () => setPlaceHere(), "btn-dig"))));
      }
      function setPlaceHere() {
        if (!navigator.geolocation) { placeNote.textContent = "このブラウザでは現在地を使えない。地名で試してみて。"; return; }
        placeNote.textContent = "現在地を確かめています…";
        navigator.geolocation.getCurrentPosition((pos) => {
          st.place = { lat: pos.coords.latitude, lon: pos.coords.longitude, name: "いまいる場所" };
          U.prefs.set("pages", "place", null);
          placeNote.textContent = "いまいる場所から探す（位置は覚えておかない）。";
          dg.run();
        }, () => { placeNote.textContent = "現在地が取れなかった。地名で試してみて。"; }, { timeout: 12000, maximumAge: 600000 });
      }
      async function setPlaceByName(name) {
        if (!name) return;
        placeNote.textContent = "「" + name + "」を探しています…";
        try {
          const d = await api("ja", { action: "query", generator: "search", gsrsearch: name, gsrlimit: 5, prop: "coordinates" });
          const p = ((d.query && d.query.pages) || []).sort((a, b) => (a.index || 0) - (b.index || 0)).find((x) => x.coordinates && x.coordinates[0]);
          if (!p) { placeNote.textContent = "「" + name + "」の位置がわからなかった。別の書き方で試してみて。"; return; }
          st.place = { lat: p.coordinates[0].lat, lon: p.coordinates[0].lon, name: p.title };
          U.prefs.set("pages", "place", st.place);
          placeNote.textContent = p.title + " を中心に探す。";
          dg.run();
        } catch (e) { placeNote.textContent = U.errorText(e); }
      }

      async function buildFind(lang, title, days, extraNote) {
        const s = await summary(lang, title);
        if (!s || s.type === "disambiguation" || /一覧$|^List of /.test(s.title || title)) return null;
        const views = total(days);
        const threads = [
          { label: "頁の中のリンクを一本たどる", value: title, run: () => { st.thread = { kind: "link", lang, title, label: "リンク", value: title }; threadCtl.set(st.thread); dg.run(); } },
          { label: "同じ分類の、読まれない頁", value: title, run: () => { st.thread = { kind: "cat", lang, title, label: "分類", value: title }; threadCtl.set(st.thread); dg.run(); } }
        ];
        let dist = "";
        if (st.vein === "near" && st.place && s.coordinates) dist = km(st.place.lat, st.place.lon, s.coordinates.lat, s.coordinates.lon).toFixed(1) + "km";
        const links = [];
        if (s.coordinates) links.push({ label: "地図で見る", url: "https://www.openstreetmap.org/?mlat=" + s.coordinates.lat + "&mlon=" + s.coordinates.lon + "#map=16/" + s.coordinates.lat + "/" + s.coordinates.lon });
        return {
          id: "wiki:" + lang + ":" + (s.title || title), room: "pages",
          kicker: [lang === "ja" ? "日本語版" : "英語版", s.description, dist ? st.place.name + "から" + dist : ""].filter(Boolean).join("／"),
          title: s.title || title,
          sub: "",
          image: s.thumbnail && s.thumbnail.source ? s.thumbnail.source : "",
          imageAlt: "",
          desc: s.extract || "",
          extra: U.h("div", null, extraNote ? U.h("p", { class: "room-note" }, extraNote) : null),
          metric: {
            value: views, unit: "回", label: "この30日間に開かれた回数",
            poem: views === 0 ? "この30日間、誰もこの頁を開いていない。" : views <= 10 ? "この30日間に開かれたのは、たった" + views + "回。" : "一日あたり、およそ" + (views / 30).toFixed(1) + "回。"
          },
          links,
          url: (s.content_urls && s.content_urls.desktop && s.content_urls.desktop.page) || "https://" + lang + ".wikipedia.org/wiki/" + encodeURIComponent(title),
          urlLabel: "Wikipedia で読む",
          threads,
          _spark: spark(days)
        };
      }

      /* 選んだ深さの帯に入る頁を、読まれていない順に並べる。帯になければ、帯より浅い（よく読まれている）
         頁のうち帯に近いものから。帯より深い頁には入らない。糸をたどっているときだけは、
         浅いほうにもなければ帯のすぐ下の頁へ（糸の先が途切れないように） */
      function loneliest(pv, lv, loose) {
        const scored = Array.from(pv.entries()).map(([t, days]) => ({ t, days, n: total(days) }));
        if (!scored.length) return null;
        scored.sort((a, b) => a.n - b.n || Math.random() - 0.5);
        const inBand = scored.filter((x) => U.inBand(x.n, lv));
        if (inBand.length) { const list = U.shuffle(inBand.slice(0, 3)).concat(inBand.slice(3)); return { list, pick: list[0], relaxed: false }; }
        const above = lv.max == null ? [] : scored.filter((x) => x.n > lv.max);
        if (above.length) return { list: above, pick: above[0], relaxed: true };
        if (loose && lv.min != null) { const below = scored.filter((x) => x.n <= lv.min).reverse(); if (below.length) return { list: below, pick: below[0], relaxed: true }; }
        return null;
      }
      /* 拾った頁がどれも選んだ帯より深かったとき（帯より深いところへは下りない） */
      function tooDeep(what) {
        const lv = LEVELS[st.depth];
        return { notice: U.notice(lv.label + "の頁が見つからなかった", what + "は、どれも" + lv.label + "（" + U.bandText(lv, "回") + "）より読まれていなかった。もう一度めくるか、深度を変えてみて。", [U.btn("もう一度", () => dg.run(), "btn-dig")]) };
      }
      /* 曖昧さ回避や一覧の頁を飛ばしながら、最初に形になった一頁を返す */
      async function firstGood(lang, r, note, stale) {
        for (const c of r.list.slice(0, 5)) {
          const f = await buildFind(lang, c.t, c.days, note);
          if (stale && stale()) return null;
          if (f) return f;
        }
        return null;
      }

      dg = U.digger({
        room: "pages", stage, trailHost,
        loadingText: () => (st.thread ? "糸をたどって頁をめくっています…" : "頁をめくっています…"),
        renderFind: (find, a) => {
          const card = U.findCard(find, { onNext: () => a.run() });
          const metric = U.$(".find-metric", card);
          if (metric && find._spark) metric.insertBefore(find._spark, U.$(".metric-poem", metric));
          return card;
        },
        dig: async (arg, stale) => {
          const lv = LEVELS[st.depth];
          if (st.thread && st.thread.kind === "link") {
            const d = await api(st.thread.lang, { action: "query", prop: "links", titles: st.thread.title, plnamespace: 0, pllimit: 500 });
            const links = (((d.query && d.query.pages) || [])[0] || {}).links || [];
            if (!links.length) return { notice: U.notice("この頁からは、どこにも行けなかった", "糸を切って、別の頁から。", [U.btn("糸を切る", () => { st.thread = null; threadCtl.set(null); dg.run(); }, "btn-dig")]) };
            const sample = U.shuffle(links.map((l) => l.title)).slice(0, 20);
            const pv = await pageviews(st.thread.lang, sample);
            if (stale()) return null;
            const r = loneliest(pv, lv, !!st.thread);
            const f = r && await firstGood(st.thread.lang, r, "「" + st.thread.title + "」の中のリンクを一本たどって来た。", stale);
            if (!f) return stale() ? null : { notice: U.notice("リンクの先に、読める頁がなかった", "糸を切って、別の頁から。", [U.btn("糸を切る", () => { st.thread = null; threadCtl.set(null); dg.run(); }, "btn-dig")]) };
            st.thread = { kind: "link", lang: st.thread.lang, title: f.title, label: "リンク", value: f.title };
            threadCtl.set(st.thread);
            return f;
          }
          if (st.thread && st.thread.kind === "cat") {
            const d = await api(st.thread.lang, { action: "query", prop: "categories", titles: st.thread.title, clshow: "!hidden", cllimit: 50 });
            const cats = (((d.query && d.query.pages) || [])[0] || {}).categories || [];
            if (!cats.length) return { notice: U.notice("この頁は、どの分類にも属していなかった", "", [U.btn("糸を切る", () => { st.thread = null; threadCtl.set(null); dg.run(); }, "btn-dig")]) };
            const cat = U.pick(cats).title;
            const pool = await categoryPool(st.thread.lang, cat, 0);
            const pv = await pageviews(st.thread.lang, U.shuffle(pool.filter((t) => t !== st.thread.title)).slice(0, 30));
            if (stale()) return null;
            const r = loneliest(pv, lv, !!st.thread);
            const f = r && await firstGood(st.thread.lang, r, "分類「" + cat.replace(/^Category:|^カテゴリ:/, "") + "」から。", stale);
            if (!f) return stale() ? null : { notice: U.notice("この分類には、ほかの頁がなかった", "", [U.btn("糸を切る", () => { st.thread = null; threadCtl.set(null); dg.run(); }, "btn-dig")]) };
            return f;
          }
          if (st.vein === "near") {
            if (!st.place) { showNearStart(); return null; }
            const d = await api("ja", { action: "query", list: "geosearch", gscoord: st.place.lat + "|" + st.place.lon, gsradius: 10000, gslimit: 100 });
            const titles = ((d.query && d.query.geosearch) || []).map((g) => g.title);
            if (!titles.length) return { notice: U.notice("近くに頁のある場所がなかった", "地名を変えて、もう一度。") };
            const pv = await pageviews("ja", U.shuffle(titles).slice(0, 60));
            if (stale()) return null;
            const r = loneliest(pv, lv, !!st.thread);
            if (!r && pv.size) return tooDeep("この辺りの頁");
            const f = r && await firstGood("ja", r, r.relaxed ? "この辺りには" + lv.label + "の頁がなかったので、それより少しよく読まれている頁を選んだ。" : "", stale);
            if (!f) return stale() ? null : { notice: U.notice("閲覧数が確かめられなかった", "少し待ってから、もう一度。", [U.btn("もう一度", () => dg.run(), "btn-dig")]) };
            return f;
          }
          if (st.vein === "topic") {
            const cat = "Category:" + (st.topic || U.pick(D.wikiTopics)[0]);
            const pool = await categoryPool("ja", cat, 2);
            if (stale()) return null;
            const pv = await pageviews("ja", U.shuffle(pool).slice(0, 40));
            if (stale()) return null;
            const r = loneliest(pv, lv, !!st.thread);
            if (!r && pv.size) return tooDeep("この分類から拾った頁");
            const f = r && await firstGood("ja", r, "分類「" + cat.replace("Category:", "") + "」の奥から。" + (r.relaxed ? lv.label + "の頁はなかったので、それより少しよく読まれている頁を選んだ。" : ""), stale);
            if (!f) return stale() ? null : { notice: U.notice("この分類には頁が見つからなかった", "もう一度掘ってみて。", [U.btn("もう一度", () => dg.run(), "btn-dig")]) };
            return f;
          }
          const lang = st.vein === "en" ? "en" : "ja";
          let best = null, seen = 0;
          for (let round = 0; round < 3; round++) {
            /* 曖昧さ回避の頁は最初から除いておく */
            const d = await api(lang, { action: "query", generator: "random", grnnamespace: 0, grnlimit: 20, prop: "pageprops", ppprop: "disambiguation" });
            const titles = ((d.query && d.query.pages) || []).filter((p) => !(p.pageprops && "disambiguation" in p.pageprops)).map((p) => p.title);
            const pv = await pageviews(lang, titles);
            if (stale()) return null;
            seen += pv.size;
            const r = loneliest(pv, lv, !!st.thread);
            if (r && !r.relaxed) {
              const f = await firstGood(lang, r, "", stale);
              if (stale()) return null;
              if (f) return f;
            }
            if (r && (!best || r.pick.n < best.list[0].n)) best = r;
          }
          if (!best && seen) return tooDeep("でたらめに拾った頁");
          const f = best && await firstGood(lang, best, best.relaxed ? lv.label + "の頁は見つからなかったので、拾った中でそれにいちばん近い、少しよく読まれている頁を選んだ。" : "", stale);
          return f || (stale() ? null : { notice: U.notice("読める頁が見つからなかった", "もう一度めくってみて。", [U.btn("もう一度", () => dg.run(), "btn-dig")]) });
        }
      });
      if (st.place) placeNote.textContent = st.place.name + " を中心に探す。";

<script>

/* 片隅 — 誰かが自分のために作ったウェブへ、でたらめに漂着する */
(function () {
  "use strict";
  const U = window.U;
  const LIST_URL = "https://raw.githubusercontent.com/kagisearch/smallweb/main/smallweb.txt";
  let feeds = null;

  async function loadFeeds() {
    if (feeds) return feeds;
    const txt = await U.fetchJSON(LIST_URL, { as: "text", source: "Kagi Small Web の名簿", retries: 1, timeout: 30000 });
    feeds = txt.split(/\r?\n/).map((s) => s.trim()).filter((s) => /^https?:\/\//.test(s));
    return feeds;
  }
  /* フィードの住所から、その人のホームページらしき住所を推し量る */
  function homeOf(feed) {
    try {
      const u = new URL(feed);
      let p = u.pathname
        .replace(/\/[^/]*\.(xml|rss|atom|json|php)$/i, "/")
        .replace(/\/(feed|rss|atom)(\/(atom|rss2?|feed))?\/?$/i, "/");
      if (!p.endsWith("/")) p += "/";
      if (p.split("/").filter(Boolean).length > 2) p = "/";
      return { host: u.hostname.replace(/^www\./, ""), url: u.origin + p, path: p };
    } catch (e) { return null; }
  }

    { name: "Wiby の「サプライズ」", desc: "1990年代の手作りホームページのような、軽くて素朴なページへ飛ばしてくれる検索エンジン。", url: "https://wiby.me/surprise/" },
    { name: "Marginalia の「でたらめ探索」", desc: "広告や SEO から遠い、文章中心の小さなサイトを画像つきで並べる。", url: "https://marginalia-search.com/explore/random" },

    { name: "Kagi Small Web", desc: "個人ブログの新しい記事を、一つずつでたらめに見せる。", url: "https://kagi.com/smallweb" }
  ];

  let api = null;
  const def = {
    id: "web", name: "片隅", group: "読む", lith: "coal",
    short: "誰かの個人サイトへ漂着",
    title: "ウェブの片隅",

    digger: () => api,
    mount(el) {
      el.append(U.roomHead(def));

      const dg = U.digger({

        renderFind: (find, a) => {
          const card = U.findCard(find, { onNext: () => a.run(), nextLabel: "また漂う" });
          return card;
        },
        dig: async (arg, stale) => {
          const list = await loadFeeds();
          if (stale()) return null;
          let h = null;
          for (let i = 0; i < 6 && !h; i++) h = homeOf(U.pick(list));
          if (!h) return null;
          const n = list.length;
          return {
            id: "web:" + h.url, room: "web",
            kicker: U.num(n) + " の個人ブログのうちの一つ",
